events {
    worker_connections 1024;
}

http {
    # Backend server pool for load balancing
    upstream backend_servers {
        least_conn;  # Use least connections load balancing algorithm
        server backend:5000;
        # Add more backend instances if scaling:
        # server backend-2:5000;
        # server backend-3:5000;
    }

    # Frontend server
    upstream frontend_servers {
        server frontend:3000;
    }

    # Server block for handling requests
    server {
        listen 80;
        server_name localhost;

        # Increase buffer sizes for better performance
        client_max_body_size 20M;
        client_body_buffer_size 128k;

        # Frontend routes
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90;
        }

        # API routes - proxied to backend with load balancing
        location /api/ {
            proxy_pass http://backend_servers/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90;
            
            # Load balancing specific headers
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
