name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # CI — Build & Test
  # ────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test · Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --passWithNoTests

  test-backend:
    name: Test · .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test  --no-build --verbosity normal

  # ────────────────────────────────────────────────────────────────────────────
  # Build & Push Docker images
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    # Only push on commits to main or develop (not on PRs)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/frontend:latest

      - name: Build & push — backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/backend:latest

  # ────────────────────────────────────────────────────────────────────────────
  # Deploy to Staging (develop branch)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy · Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/app
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export DB_CONNECTION_STRING="${{ secrets.DB_CONNECTION_STRING }}"
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  # ────────────────────────────────────────────────────────────────────────────
  # Deploy to Production (main branch)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy · Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production        # requires manual approval in GitHub UI

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/app
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export DB_CONNECTION_STRING="${{ secrets.DB_CONNECTION_STRING }}"
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"

            # Rolling update — zero downtime
            docker compose pull
            docker compose up -d --no-deps --remove-orphans frontend
            docker compose up -d --no-deps --remove-orphans backend
            docker compose up -d --no-deps --remove-orphans nginx
            docker image prune -f
