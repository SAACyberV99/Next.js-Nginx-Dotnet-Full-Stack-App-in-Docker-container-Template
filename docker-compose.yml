version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: nextjs-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://nginx:80
    networks:
      - app-network
    restart: unless-stopped

  # .NET Backend (you can scale this service)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: dotnet-backend
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    networks:
      - app-network
    restart: unless-stopped
    # To run multiple instances for load balancing, use:
    # deploy:
    #   replicas: 3

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nginx-loadbalancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
